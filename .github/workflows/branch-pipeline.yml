name: Branch Pipeline

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generator-core
        run: npm run build:core

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build web
        run: npm run build:web

      - name: Build MCP
        run: npm run build:mcp

      - name: Add job summary
        if: always()
        run: |
          echo "## Verify summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build & Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Generator Core build:** see step \"Build generator-core\" above" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests:** see step \"Run tests\" above" >> $GITHUB_STEP_SUMMARY
          echo "- **Web build:** see step \"Build web\" above" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP build:** see step \"Build MCP\" above" >> $GITHUB_STEP_SUMMARY
