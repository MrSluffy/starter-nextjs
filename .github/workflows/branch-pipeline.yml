name: Branch Pipeline

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test

      - name: Validate generated projects
        run: npm run test:generated

      - name: Install Playwright browsers for smoke checks
        run: npx playwright install --with-deps chromium

      - name: Run generated project smoke checks
        run: npm run test:generated:smoke

      - name: Build application
        run: npm run build

      - name: Add job summary
        if: always()
        run: |
          echo "## Verify summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vitest Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit and component tests:** see step \"Run unit and component tests\" above" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated project validation:** see step \"Validate generated projects\" above" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke checks:** see step \"Run generated project smoke checks\" above" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** completed" >> $GITHUB_STEP_SUMMARY

  e2e:
    name: Browser Tests ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: playwright-report-${{ github.ref_name }}
          path: playwright-report
          if-no-files-found: ignore
